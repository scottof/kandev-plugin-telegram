# kandev plugin manifest for the Telegram bot. `id` must match go.mod, the
# Makefile BIN and the id passed to window.registerKandevPlugin in ui/bundle.js.
id: "kandev-plugin-telegram"
api_version: 1
version: "0.1.0"
display_name: "Telegram"
description: "Telegram bot for kandev: alerts with task links when an agent waits on a human or a task ends, /new to file a task through a triage agent, and /status."
author: "scottof"
categories: ["connector"]

# Oldest release with every host API this plugin calls. Raise it when a newer
# API is used. The check is skipped on hosts built from a git checkout.
min_kandev_version: "0.92.0"

runtime:
  type: binary
  executables:
    linux-amd64: "server/plugin-linux-amd64"
    linux-arm64: "server/plugin-linux-arm64"
    darwin-amd64: "server/plugin-darwin-amd64"
    darwin-arm64: "server/plugin-darwin-arm64"
    windows-amd64: "server/plugin-windows-amd64.exe"

capabilities:
  # task.state_changed drives finished/failed/review alerts;
  # session.pending_action_changed only triggers an early ListPending check.
  events: ["task.state_changed", "session.pending_action_changed"]
  state: true
  api_read: ["tasks", "interactions"]

ui:
  bundle: "/ui/bundle.js"

# kandev restarts the plugin process when these are saved.
config_schema:
  type: object
  properties:
    bot_token:
      type: string
      title: "Bot token"
      description: "Token from @BotFather. Stored in kandev's encrypted vault."
      secret: true
    allowed_user_ids:
      type: string
      title: "Allowed Telegram user ids"
      description: "Comma-separated numeric user ids. Messages from anyone else are ignored. Empty means the bot answers nobody."
    kandev_url:
      type: string
      title: "kandev URL"
      description: "Base URL your phone uses to open kandev, for example a Tailscale address. Used only to build links."
    triage_agent_profile:
      type: string
      format: agent-profile
      title: "Triage agent profile"
      description: "Agent profile /new uses to place a task. Not set uses the default from Settings > Utility Agents."
    start_agent:
      type: boolean
      title: "Start an agent on tasks filed with /new"
      default: false
    alert_interactions:
      type: boolean
      title: "Alert when an agent waits for permission or an answer"
      default: true
    alert_completed:
      type: boolean
      title: "Alert when a task is completed"
      default: true
    alert_failed:
      type: boolean
      title: "Alert when a task fails to start"
      default: true
    alert_review:
      type: boolean
      title: "Alert when a task moves to review (after every agent turn)"
      default: false
