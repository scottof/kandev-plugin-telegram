# kandev plugin manifest for the Telegram bot. `id` must match go.mod, the
# Makefile BIN and the id passed to window.registerKandevPlugin in ui/bundle.js.
id: "kandev-plugin-telegram"
api_version: 1
version: "0.1.4"
display_name: "Telegram"
description: "Telegram bot for kandev: alerts with task links when an agent waits on a human or a task ends, /new to file a task through a triage agent, /status, and a notify_user tool agents can call."
author: "scottof"
categories: ["connector"]

# Oldest release with every host API this plugin calls: ListPending (0.92.0)
# and UtilityAgentOptions.ProfileID (0.95.0). The check is skipped on hosts
# built from a git checkout.
min_kandev_version: "0.95.0"

runtime:
  type: binary
  executables:
    linux-amd64: "server/plugin-linux-amd64"
    linux-arm64: "server/plugin-linux-arm64"
    darwin-amd64: "server/plugin-darwin-amd64"
    darwin-arm64: "server/plugin-darwin-arm64"
    windows-amd64: "server/plugin-windows-amd64.exe"

capabilities:
  # task.state_changed drives finished/failed/review alerts. task.created,
  # task.updated and task.moved drive the opt-in column alert: kandev publishes
  # task.moved only for board and API moves, and task.updated for the moves its
  # workflows make. session.pending_action_changed only triggers an early
  # ListPending check.
  events: ["task.state_changed", "task.created", "task.updated", "task.moved", "session.pending_action_changed"]
  state: true
  agent_invoke: true
  api_read: ["workspaces", "workflows", "repositories", "tasks", "interactions"]
  api_write: ["tasks"]

# Called only by the settings card through host.api.fetch. Manifest actions
# need a workspace, task or repository scope, which the settings page lacks.
webhooks:
  - key: "status"
    description: "Bot connection status for the settings card."
    method: "GET"
    access: "authenticated"
  - key: "test"
    description: "Checks the token and sends a test message to the allowed users."
    method: "POST"
    access: "authenticated"

agent_tools:
  - name: notify_user
    description: "Send one plain-text Telegram message about the current task to the people allowed in the Telegram plugin, or to one of them. The message gets a line naming the task and a link to it. Use one stable idempotency_key per event: repeating a key returns the stored outcome without sending again. Never retry an uncertain outcome with a new key."
    surfaces: [kanban-task, office-task]
    input_schema:
      type: object
      additionalProperties: false
      required: [message, idempotency_key]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 3500
          description: "Plain text, at most 3500 characters. No formatting is applied."
        idempotency_key:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:/-]{0,127}$'
          description: "Stable key for this notification event, for example deploy:2026-10-24."
        recipient:
          type: integer
          minimum: 1
          description: "Optional Telegram user id from the allowed list. Omit it to message every allowed user."
    output_schema:
      type: object
      additionalProperties: false
      required: [status, code, detail, duplicate]
      properties:
        status:
          type: string
          enum: [delivered, partial, failed, uncertain, rejected]
        code: { type: string }
        detail: { type: string }
        duplicate: { type: boolean }
        retry_after_seconds: { type: integer, minimum: 0 }
        delivered_to: { type: array, items: { type: integer } }
        failed_for: { type: array, items: { type: integer } }
        uncertain_for: { type: array, items: { type: integer } }
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: true

ui:
  bundle: "/ui/bundle.js"

# kandev restarts the plugin process when these are saved.
config_schema:
  type: object
  properties:
    bot_token:
      type: string
      title: "Bot token"
      description: "Token from @BotFather. Stored in kandev's encrypted vault."
      secret: true
    allowed_user_ids:
      type: string
      title: "Allowed Telegram user ids"
      description: "Comma-separated numeric user ids. Messages from anyone else are ignored. Empty means the bot answers nobody."
    kandev_url:
      type: string
      title: "kandev URL"
      description: "Base URL your phone uses to open kandev, for example a Tailscale address. Used only to build links."
    triage_agent_profile:
      type: string
      format: agent-profile
      title: "Triage agent profile"
      description: "Agent profile /new uses to place a task. Not set uses the default from Settings > Utility Agents, or, when that is not set either and there is only one workspace, that workspace's default agent."
    start_agent:
      type: boolean
      title: "Start an agent on tasks filed with /new"
      default: false
    alert_interactions:
      type: boolean
      title: "Alert when an agent waits for permission or an answer"
      default: true
    alert_completed:
      type: boolean
      title: "Alert when a task is completed"
      default: true
    alert_failed:
      type: boolean
      title: "Alert when a task fails to start"
      default: true
    alert_review:
      type: boolean
      title: "Alert when a task moves to review (after every agent turn)"
      default: false
    alert_column_moves:
      type: boolean
      title: "Alert when a task changes column (board moves and the moves kandev makes after an agent turn)"
      default: false
